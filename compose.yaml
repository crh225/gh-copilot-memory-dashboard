services:
  dashboard:
    build: .
    ports:
      - "127.0.0.1:${PORT:-3210}:3210"
    volumes:
      - type: bind
        source: ${COPILOT_DATA_DIR:-~/.copilot}
        target: /data
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:size=16m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
